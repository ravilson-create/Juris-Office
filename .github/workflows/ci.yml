name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  test-memoria-pglite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  test-postgres-real:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: juris
          POSTGRES_PASSWORD: juris
          POSTGRES_DB: juris_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://juris:juris@localhost:5432/juris_ci
      TEST_DATABASE_URL: postgresql://juris:juris@localhost:5432/juris_ci
      # O banco deste job é descartável e criado do zero a cada run — a trava de ativação
      # coordenada da P2 (migrate.mjs, ver docs/P2-AUTENTICACAO.md) é uma proteção para o Neon de
      # produção com dados reais, não se aplica aqui. Sem isto, migrações ≥ 0003 ficam pendentes
      # e qualquer teste que use uma coluna/tabela delas via RealPgDb falha com "does not exist".
      ENABLE_P2_AUTH_MIGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:pg-real

  e2e-memoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
